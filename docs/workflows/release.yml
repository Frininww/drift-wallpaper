name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: bash scripts/build-app.sh --universal
      - name: Archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Drift.app dist/Drift-universal.zip
          cd dist
          shasum -a 256 Drift-universal.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Drift-universal.zip dist/SHA256SUMS.txt --verify-tag --title "Drift $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
